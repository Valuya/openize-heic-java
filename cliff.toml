# git-cliff: the next release version, from the Conventional Commits since the last release tag, and its notes.
# A breaking change bumps the major version, feat the minor, any other conventional commit the patch.
# tools/release-version.sh and the release workflow use it; see the README's Releasing section.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# the HTML comments order the groups
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
