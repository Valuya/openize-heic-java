name: release

# Publishes io.github.valuya:heic-decoder to Maven Central, when run by hand on main. The version is not committed:
# tools/release-version.sh computes it from the Conventional Commits that changed the library since the last release
# tag, and the run ends with that version's tag, vX.Y.Z, and its GitHub release. A run with no library change since
# the last release publishes nothing.
#
# The tag is pushed last, once the version is on Central, so that a tag always means "published": the next run
# computes its version from it.
#
# The Valuya organization secrets lombok-optionalgetter publishes with, shared with this repository:
#   GPG_PRIVATE_KEY   - ASCII-armored private signing key
#   GPG_PASSPHRASE    - passphrase of that key
#   CENTRAL_USERNAME  - Central Portal user token, username
#   CENTRAL_PASSWORD  - its password (central.sonatype.com -> View Account -> Generate User Token)
# The io.github.valuya namespace is verified in the Central Portal.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      # the tag and the GitHub release
      contents: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases are made from main, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v4
        with:
          # the tags and the commits since the last release
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # writes the `central` server of settings.xml, its credentials read from these variables
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.10.1
      - name: Resolve the version
        id: cfg
        run: |
          release=$(tools/release-version.sh)
          echo "$release" | tee -a "$GITHUB_OUTPUT"
          eval "$release"
          if [ "$needed" = false ]; then
            echo "::notice::nothing changed src/main or pom.xml since ${last}: nothing to release"
            exit 0
          fi
          URL="https://repo1.maven.org/maven2/io/github/valuya/heic-decoder/${version}/heic-decoder-${version}.pom"
          if curl -sfI "$URL" > /dev/null; then
            # an earlier run published it, then failed to push the tag
            echo "::error::${version} is on Maven Central but not tagged: tag v${version} on the commit the run that"
            echo "::error::published it was built from, then run the release again"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publishing io.github.valuya:heic-decoder:${version}, after ${last}"
      # the release runs the tests of build.yml, LibheifComparisonTest included
      - name: Install libheif
        if: steps.cfg.outputs.needed == 'true'
        timeout-minutes: 5
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265
        continue-on-error: true
      - name: Build, sign and publish to Maven Central
        if: steps.cfg.outputs.needed == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ] || [ -z "$MAVEN_GPG_PASSPHRASE" ]; then
            echo "::error::share the CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE"
            echo "::error::organization secrets with this repository"
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode --no-transfer-progress deploy -Prelease -DautoPublish=true -DwaitUntil=published
      - name: Tag and release on GitHub
        if: steps.cfg.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          git tag "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
          tools/release-version.sh --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
      # Published on the Portal is not yet resolvable: the sync to repo1 usually takes minutes
      - name: Wait until it resolves from Maven Central
        if: steps.cfg.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
          URL: ${{ steps.cfg.outputs.url }}
        run: |
          for attempt in $(seq 1 40); do
            if curl -sfI "$URL" > /dev/null; then
              echo "io.github.valuya:heic-decoder:${VERSION} resolves from Maven Central"
              exit 0
            fi
            echo "attempt ${attempt}/40: not on Maven Central yet"
            sleep 45
          done
          echo "::error::${VERSION} is not on Maven Central after 30 minutes:"
          echo "::error::see https://central.sonatype.com/publishing/deployments"
          exit 1
