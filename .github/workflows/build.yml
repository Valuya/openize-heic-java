name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported release, and the JDK the project is developed on
        java: [21, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # libheif's heif-convert, for LibheifComparisonTest; without it the test is skipped, not failed
      - name: Install libheif
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples
        continue-on-error: true
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
